  <meta name="application-name" content="Game Night" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Game Night" />

  <link rel="shortcut icon" href="/icons/favicon-32.png" />

  <!-- Link previews (WhatsApp, iMessage, Slack, LinkedIn, X).
       %ORIGIN% is substituted per request by the server, because crawlers need absolute
       URLs and do not run JavaScript. The image is JPEG and ~80KB on purpose: WhatsApp
       silently drops previews whose image is near 300KB. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Game Night by Ankit Kumar Mishra" />
  <meta property="og:title" content="%OG_TITLE%" />
  <meta property="og:description" content="%OG_DESC%" />
  <meta property="og:url" content="%ORIGIN%/" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image" content="%ORIGIN%%OG_IMAGE%" />
  <meta property="og:image:secure_url" content="%ORIGIN%%OG_IMAGE%" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="%OG_TITLE%" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="%OG_TITLE%" />
  <meta name="twitter:description" content="%OG_DESC%" />
  <meta name="twitter:image" content="%ORIGIN%%OG_IMAGE%" />
  <meta name="twitter:image:alt" content="Game Night by Ankit Kumar Mishra" />

  <!-- Structured data: what the app is, who made it, and answers to the questions people
       actually search for. Everything here is true; nothing is invented for rich results. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebApplication",
        "@id": "%ORIGIN%/#app",
        "name": "Game Night",
        "alternateName": "Game Night by Ankit Kumar Mishra",
        "url": "%ORIGIN%/",
        "description": "Free real-time multiplayer party games playable in a browser with a room code. Includes Blend In, Island Rules, Silent Order, Swap or Stay and Sleepless.",
        "applicationCategory": "GameApplication",
        "applicationSubCategory": "Party game",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript and WebSockets",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "isFamilyFriendly": true,
        "image": "%ORIGIN%/icons/og-image.jpg",
        "screenshot": "%ORIGIN%/icons/og-image.jpg",
        "featureList": [
          "Blend In: one secret word, hidden outsiders, and a Blank with no word at all",
          "Island Rules: guess the hidden pattern behind what can come aboard",
          "Join with a five-character room code, no account needed",
          "Installable as an app on phone and desktop",
          "Points, titles and a per-room leaderboard"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@id": "%ORIGIN%/#author" },
        "creator": { "@id": "%ORIGIN%/#author" },
        "copyrightHolder": { "@id": "%ORIGIN%/#author" },
        "copyrightYear": "2026"
      },
      {
        "@type": "Person",
        "@id": "%ORIGIN%/#author",
        "name": "Ankit Kumar Mishra",
        "image": "%ORIGIN%/icons/author-192.png",
        "email": "mailto:akmishra5514@gmail.com",
        "url": "https://ankitkumarmishra.is-a.dev",
        "sameAs": [
          "https://ankitkumarmishra.is-a.dev",
          "https://www.linkedin.com/in/ankitkumarmishra/",
          "https://github.com/AnkitKumarMishra5"
        ]
      },
      {
        "@type": "FAQPage",
        "@id": "%ORIGIN%/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need to download anything or create an account?",
            "acceptedAnswer": { "@type": "Answer", "text": "No. Open the link, type a name, and either create a room or enter a friend's five-character room code. There is no download, no sign-up and no password." }
          },
          {
            "@type": "Question",
            "name": "How many players do I need?",
            "acceptedAnswer": { "@type": "Answer", "text": "Blend In needs at least five players. Island Rules works from two. Everyone plays on their own phone or laptop, in the same room or anywhere in the world." }
          },
          {
            "@type": "Question",
            "name": "Is it free?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes, completely free, with no ads and no in-app purchases." }
          },
          {
            "@type": "Question",
            "name": "Can I install it on my phone?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes. It is a progressive web app, so your browser can add it to your home screen and it opens full screen like a native app." }
          }
        ]
      }
    ]
  }
  </script>
