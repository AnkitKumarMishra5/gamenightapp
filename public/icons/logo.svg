<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Game Night logo — a fan of cards under a crescent moon">
  <defs>
    <linearGradient id="gn-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2140"/>
      <stop offset="0.55" stop-color="#10152b"/>
      <stop offset="1" stop-color="#0b0e1a"/>
    </linearGradient>
    <linearGradient id="gn-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7dd"/>
      <stop offset="0.45" stop-color="#efe2b0"/>
      <stop offset="1" stop-color="#d9bc63"/>
    </linearGradient>
    <linearGradient id="gn-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232c55"/>
      <stop offset="1" stop-color="#151b38"/>
    </linearGradient>
    <radialGradient id="gn-sheen" cx="0.5" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#e5cd7e" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#e5cd7e" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#e5cd7e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#gn-tile)"/>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#gn-sheen)"/>
  <rect x="3.25" y="3.25" width="93.5" height="93.5" rx="22.75" fill="none" stroke="url(#gn-gold)" stroke-opacity="0.85" stroke-width="2.5"/>

  <!-- crescent moon, top right -->
  <path d="M76.5 21.5a10.6 10.6 0 1 0 3.9 14.6 8.6 8.6 0 0 1-3.9-14.6z" fill="url(#gn-gold)"/>
  <circle cx="62.5" cy="20.5" r="1.6" fill="#efe2b0"/>

  <!-- fan of three cards -->
  <g transform="translate(50 66)">
    <g transform="rotate(-22) translate(-11 0)">
      <rect x="-11" y="-19" width="22" height="31" rx="4.5" fill="url(#gn-card)" stroke="url(#gn-gold)" stroke-opacity="0.55" stroke-width="1.8"/>
    </g>
    <g transform="rotate(22) translate(11 0)">
      <rect x="-11" y="-19" width="22" height="31" rx="4.5" fill="url(#gn-card)" stroke="url(#gn-gold)" stroke-opacity="0.55" stroke-width="1.8"/>
    </g>
    <g>
      <rect x="-12.5" y="-22" width="25" height="35" rx="5" fill="url(#gn-card)" stroke="url(#gn-gold)" stroke-width="2.2"/>
      <path d="M0 -12.5 L6.4 -4.5 L0 5.5 L-6.4 -4.5 Z" fill="url(#gn-gold)"/>
    </g>
  </g>
</svg>
