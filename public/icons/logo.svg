<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Game Night logo — two friends, one of them masked">
  <defs>
    <linearGradient id="gn-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="gn-glow" cx="0.32" cy="0.22" r="0.82">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#gn-badge)"/>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#gn-glow)"/>

  <!-- friend behind, on the right: smaller and softer so it reads as depth -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="68.5" cy="33" r="11"/>
    <path d="M50 84c0-10.2 8.3-18.5 18.5-18.5S87 73.8 87 84z"/>
  </g>

  <!-- friend in front, on the left: the masked one -->
  <g fill="#ffffff">
    <circle cx="37" cy="38" r="15"/>
    <path d="M12 88c0-13.8 11.2-25 25-25s25 11.2 25 25z"/>
  </g>

  <!-- domino mask across the eyes only: a band with two eye holes, in the badge colour -->
  <g fill="url(#gn-badge)">
    <path d="M22.6 33.2h28.8c1.3 0 2.3 1 2.3 2.3v3.1c0 4.6-3.7 8.3-8.3 8.3-2.9 0-5.5-1.5-6.9-3.8-1.4 2.3-4 3.8-6.9 3.8-4.6 0-8.3-3.7-8.3-8.3v-3.1c0-1.3 1-2.3 2.3-2.3z"/>
  </g>
  <g fill="#ffffff">
    <ellipse cx="30.4" cy="38.6" rx="2.9" ry="3.3"/>
    <ellipse cx="45.6" cy="38.6" rx="2.9" ry="3.3"/>
  </g>
</svg>
