<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Night · scenario browser</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/games/silentorder.css">
<link rel="stylesheet" href="/css/games/swaporstay.css">
<link rel="stylesheet" href="/css/games/sleepless.css">
<style>
  body { background: var(--bg); padding: 0 0 60px; }
  .dev-bar {
    position: sticky; top: 0; z-index: 60; display: flex; gap: 6px; flex-wrap: wrap;
    padding: 10px 14px; background: rgba(11,14,26,0.96); border-bottom: 1px solid var(--stroke);
    backdrop-filter: blur(10px);
  }
  .dev-bar b { font-family: var(--display); font-size: 15px; margin-right: 8px; align-self: center; }
  .dev-tab {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--stroke);
    background: var(--glass); color: var(--ink-dim); font: inherit; font-size: 12.5px;
    font-weight: 700; cursor: pointer;
  }
  .dev-tab:hover { color: var(--ink); }
  .dev-tab.on { background: rgba(139,92,246,0.2); border-color: var(--violet); color: var(--ink); }
  .dev-stage { max-width: 720px; margin: 0 auto; padding: 18px 14px; }
  .dev-note { color: var(--ink-dim); font-size: 12.5px; margin: 0 0 12px; text-align: center; }
</style></head>
<body>
  <div class="dev-bar" id="bar"><b>🎬 Scenarios</b></div>
  <div class="dev-stage"><p class="dev-note" id="note"></p><div id="stage" class="stack"></div></div>
  <script type="module" src="/dev/scenarios.js"></script>
</body></html>
